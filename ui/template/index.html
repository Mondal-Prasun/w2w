<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Processing Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-emerald-50 min-h-screen flex flex-col items-center p-6">

    <!-- Header & Health Indicator -->
    <header class="w-full max-w-7xl flex justify-between items-center pb-6 mb-8 border-b border-emerald-900/40">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 rounded-full bg-emerald-500 shadow-[0_0_10px_#10b981]"></div>
            <h1 class="text-2xl font-bold tracking-tight text-white">FFmpeg Task Processor</h1>
        </div>
        <div id="healthBadge" class="flex items-center space-x-2 bg-gray-900 border border-emerald-900/50 px-3.5 py-1.5 rounded-full text-xs font-semibold text-gray-400">
            <span id="healthDot" class="w-2.5 h-2.5 rounded-full bg-gray-500 animate-pulse"></span>
            <span id="healthText">Checking Server...</span>
        </div>
    </header>

    <!-- Main Two-Column Layout -->
    <main class="w-full max-w-7xl grid grid-cols-1 lg:grid-cols-12 gap-8">

        <!-- LEFT COLUMN: Staging & Batch Upload Form -->
        <section class="lg:col-span-5 bg-gray-900 p-6 rounded-2xl border border-emerald-900/50 shadow-2xl h-fit space-y-6">
            <div>
                <h2 class="text-lg font-bold text-white mb-1">Create Job Batch</h2>
                <p class="text-xs text-emerald-400/80">Configure tasks and add them to your batch queue before uploading.</p>
            </div>

            <!-- Item Input Controls -->
            <div class="space-y-4 bg-gray-950/60 p-4 rounded-xl border border-emerald-900/30">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-emerald-400 mb-1.5">Job Type</label>
                    <select id="jobType" class="w-full bg-gray-900 border border-emerald-900/60 rounded-lg p-2.5 text-sm text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        <option value="Thumbnail">Thumbnail</option>
                        <option value="Rescale">Rescale</option>
                        <option value="Segmentation">Segmentation</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-emerald-400 mb-1.5">Video File</label>
                    <input type="file" id="jobFile" accept="video/*" class="w-full bg-gray-900 border border-emerald-900/60 rounded-lg p-2 text-xs text-gray-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:bg-emerald-600 file:text-white hover:file:bg-emerald-500 cursor-pointer">
                </div>

                <button type="button" id="addToQueueBtn" class="w-full bg-gray-800 hover:bg-gray-750 text-emerald-400 font-semibold text-xs py-2.5 rounded-lg border border-emerald-500/30 hover:border-emerald-500/60 transition-all flex justify-center items-center space-x-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    <span>Add Task to Batch</span>
                </button>
            </div>

            <!-- Staged Items Preview List -->
            <div class="space-y-3">
                <div class="flex justify-between items-center text-xs text-gray-400">
                    <span class="font-semibold uppercase tracking-wider">Staged Batch Queue</span>
                    <span id="stagedCount" class="text-emerald-400 font-bold">0 Items</span>
                </div>

                <div id="stagedList" class="space-y-2 max-h-48 overflow-y-auto pr-1 text-xs">
                    <div id="emptyStagedState" class="text-center py-6 text-gray-500 bg-gray-950/40 rounded-lg border border-dashed border-emerald-900/20">
                        No tasks added to batch yet.
                    </div>
                </div>
            </div>

            <!-- Single Master Upload Button -->
            <button type="button" id="uploadBatchBtn" disabled class="w-full bg-emerald-600 hover:bg-emerald-500 disabled:bg-gray-800 disabled:text-gray-600 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-emerald-950 flex items-center justify-center space-x-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                <span id="uploadBtnText">Upload All Jobs (0)</span>
            </button>
        </section>

        <!-- RIGHT COLUMN: Multi-Job Status Panel -->
        <section class="lg:col-span-7 space-y-4">
            <div class="flex items-center justify-between pb-2 border-b border-emerald-900/40">
                <h2 class="text-lg font-bold text-white">Active & Completed Jobs</h2>
                <span id="jobCount" class="text-xs font-semibold text-emerald-400 bg-emerald-950/60 border border-emerald-800/50 px-3 py-1 rounded-full">0 Executed</span>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="bg-gray-900/50 border border-dashed border-emerald-900/30 rounded-2xl p-10 text-center text-gray-500">
                No active jobs. Add tasks to your batch and trigger the upload button.
            </div>

            <!-- Dynamic Cards Container -->
            <div id="jobsList" class="space-y-4 max-h-[72vh] overflow-y-auto pr-1"></div>
        </section>

    </main>

    <!-- App Script -->
    <script src="/static/app.js"></script>
</body>
</html>
