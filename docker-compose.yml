services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - REDIS_ADDR=redis_server:6379
      - SERVER_ADDR=:8080
    volumes:
      - app_uploads:/app/upload
      - app_process_job:/app/processJobs
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image : redis:latest
    container_name: redis_server
    ports:
      - "6379:6379"
    volumes:
      - "redis_data:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
  app_uploads:
  app_process_job:
